<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <a href="https://github.com/dirkarnez/base64-to-c-struct" target="_blank">dirkarnez/base64-to-c-struct</a><br>
  <pre id="json-container" style="background: #f4f4f4; padding: 15px; border-radius: 5px;"></pre>
  <div id="container"></div>
  <script>
    const div = document.getElementById("container");
    const log = (...data) => div.innerHTML += `${data.join(String.fromCharCode(0x20))}<br>`;
    const error = (...data) => div.innerHTML += `<span style="color: red">${data.join(String.fromCharCode(0x20))}<span><br>`;
    // log(1,2,3);
    // error(1,2,3);

    (() => {
      // BuIAABIrAQBEULVS5S8AAGBQ1zUnEQAAi+0sOycRAACBGAxY5S8AAA==
      const isLittleEndian = true;
      const dataView = new DataView(Uint8Array.fromBase64(prompt("Base64 value")).buffer);
      // dataView.getUint16(0, isLittleEndian);
      
      const arr = [
          {type: "uint8_t", field: "dlog_token"},
          {type: "int8_t", field: "rssi"},
          {type: "uint32_t", field: "rtt"},
          {type: "uint64_t", field: "t1"},
          {type: "uint64_t", field: "t2"},
          {type: "uint64_t", field: "t3"},
          {type: "uint64_t", field: "t4"}
      ];
      
      let offset = 0;
      const output = arr.map(a => {
          if (a.type == "uint8_t") {
              const element = {...a, value: dataView.getUint8(offset, true) };
              offset += 1;
              return element;
          } if (a.type == "int8_t") {
              const element = {...a, value: dataView.getInt8(offset, true) };
              offset += 1;
              return element;
          } if (a.type == "uint32_t") {
              const element = {...a, value: dataView.getUint32(offset, true) };
              offset += 4;
              return element;
          } if (a.type == "uint64_t") {
              const element = {...a, value: dataView.getBigUint64(offset, true) };
              offset += 8;
              return element;
          } else {
              return a;
          }
      });
      
      document.getElementById('json-container').textContent = JSON.stringify(output, null, 2);
    })();
  </script>
</body>
</html>
